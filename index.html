<style>
  :root{

    --navy-mid: #123c69;
    --gold: #d4af6a;
    --gold-soft: #f0dcb0;
    --paper: #f7f3e9;
    --emerald: #159a7f;
    --emerald-deep: #0d6e5a;
    --ink: #10202f;
    --muted: #7c8aa0;
    --radius: 22px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', sans-serif;

      radial-gradient(circle at 85% 90%, rgba(21,154,127,0.12), transparent 45%),
      linear-gradient(180deg, var(--navy-deep) 0%, #0e2749 55%, var(--navy-mid) 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:6vh 20px 60px;
    overflow-x:hidden;
    position:relative;
  }

  /* Faint arabesque geometric watermark */
  .arabesque{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.06;
    background-image: radial-gradient(circle, transparent 0 18px, rgba(255,255,255,0.6) 19px 20px, transparent 21px);
    background-size: 90px 90px;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
  }

  .brand{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:10px;
    margin-bottom: 8px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:12px;
    color: var(--gold-soft);
    opacity:0.85;
  }
  .brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }

  .hero{
    position:relative; z-index:1;
    text-align:center;
    margin-bottom: 34px;
    transition: margin 0.35s ease;
  }
  .hero.compact{ margin-bottom: 22px; }
  .hero h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(30px, 5vw, 48px);
    margin:0 0 6px;
    background: linear-gradient(90deg, #ffffff 20%, var(--gold-soft) 65%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{
    margin:0; color:#c7d3e6; font-size:15px; font-weight:500;
  }

  .search-wrap{
    position:relative; z-index:1;
    width:100%; max-width:620px;
  }
  .search-box{
    display:flex; align-items:center; gap:12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 999px;
    padding: 16px 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
  }
  .search-box:focus-within{
    border-color: rgba(212,175,106,0.6);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 0 4px rgba(212,175,106,0.15), inset 0 1px 0 rgba(255,255,255,0.14);
    transform: translateY(-1px);
  }
  .search-box svg{ flex-shrink:0; opacity:0.75; }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:16px; font-weight:500; color:#fff;
  }
  .search-box input::placeholder{ color: rgba(255,255,255,0.45); }
  .clear-btn{
    background:none; border:none; color: rgba(255,255,255,0.5);
    cursor:pointer; display:none; padding:4px; border-radius:50%;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .clear-btn:hover{ color:#fff; background:rgba(255,255,255,0.12); }
  .clear-btn.show{ display:flex; }

  .hint{
    text-align:center; font-size:13px; color: rgba(255,255,255,0.4);
    margin-top:14px; position:relative; z-index:1;
  }

  .results{
    position:relative; z-index:1;
    width:100%; max-width:760px;
    margin-top: 30px;
    display:grid;
    gap:16px;
  }

  .card{
    background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    padding: 20px 22px;
    display:flex; align-items:center; gap:18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform-style: preserve-3d;
    transform: perspective(800px) rotateX(0deg) rotateY(0deg) translateY(14px) scale(0.96);
    opacity:0;
    animation: popIn 0.5s cubic-bezier(.2,.9,.3,1.3) forwards;
    box-shadow: 0 12px 30px rgba(0,0,0,0.28);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover{
    border-color: rgba(212,175,106,0.45);
    box-shadow: 0 18px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(212,175,106,0.15);
  }
  @keyframes popIn{
    to{ opacity:1; transform: perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1); }
  }

  .avatar{
    flex-shrink:0;
    width:54px; height:54px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:19px;
    color: var(--navy-deep);
    background: linear-gradient(145deg, var(--gold-soft), var(--gold));
    box-shadow: 0 6px 16px rgba(212,175,106,0.35), inset 0 1px 1px rgba(255,255,255,0.6);
  }

  .info{ flex:1; min-width:0; }
  .info .name{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px;
    margin:0 0 6px; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .info .meta{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:600;
    padding: 4px 10px; border-radius:8px;
    color: #dfe7f3;
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
  }
  .chip.now{
    color: #d7f5ec;
    background: rgba(21,154,127,0.18);
    border-color: rgba(21,154,127,0.4);
  }
  .arrow{ opacity:0.5; font-size:12px; }
  .info .wali{
    margin:8px 0 0; font-size:12.5px; color: rgba(255,255,255,0.5);

  }

    flex-shrink:0;

    font-weight:700; font-size:13.5px;
    padding:11px 16px; border-radius:14px;
    box-shadow: 0 8px 18px rgba(21,154,127,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    white-space:nowrap;
  }
  .wa-btn:hover{
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 12px 26px rgba(21,154,127,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    filter: brightness(1.06);
  }
  .wa-btn:active{ transform: translateY(0) scale(0.98); }

  .empty, .prompt-empty{
    position:relative; z-index:1;
    text-align:center;
    color: rgba(255,255,255,0.55);
    margin-top: 36px;
    font-size:14.5px;
    max-width:400px;

  .empty strong{ color:#fff; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

    margin-top:30px;

  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    *{ transition:none !important; }
  }

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsEl = document.getElementById('results');
const emptyState = document.getElementById('emptyState');
const emptyQuery = document.getElementById('emptyQuery');
const promptEmpty = document.getElementById('promptEmpty');
const countBadge = document.getElementById('countBadge');
const hero = document.getElementById('hero');

function normalize(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function waLink(student){
  const pesan =
`Assalamu'alaikum wr wb.

Saya wali dari ${student.nama}, yang sekarang masuk kelas ${student.kelasSekarang}.

Mohon agar nomor ini, dimasukkan ke grup kelas.

Terimakasih.

Wassalamu'alaikum wr wb`;
  return `https://wa.me/${student.waNomor}?text=${encodeURIComponent(pesan)}`;
}

function renderResults(query){
  resultsEl.innerHTML = '';
  const q = normalize(query.trim());

  if(!q){
    promptEmpty.style.display = 'block';
    emptyState.style.display = 'none';
    countBadge.style.display = 'none';
    hero.classList.remove('compact');
    return;
  }

  hero.classList.add('compact');
  promptEmpty.style.display = 'none';

  const matches = STUDENTS.filter(s => normalize(s.nama).includes(q));

  if(matches.length === 0){
    emptyState.style.display = 'block';
    emptyQuery.textContent = `"${query}"`;
    countBadge.style.display = 'none';
    return;
  }

  emptyState.style.display = 'none';
  countBadge.style.display = 'block';
  countBadge.textContent = `${matches.length} siswa ditemukan`;

  matches.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <div class="avatar">${initials(s.nama)}</div>
      <div class="info">
        <p class="name">${s.nama}</p>
        <div class="meta">
          <span class="chip">${s.asalKelas}</span>
          <span class="arrow">&#8594;</span>
          <span class="chip now">${s.kelasSekarang} &middot; 2026</span>
        </div>
        <p class="wali">Wali kelas: <span>${s.waliKelas}</span></p>
      </div>
      <a class="wa-btn" href="${waLink(s)}" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.07L2 22l5.1-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.43-4.4-1.19l-.32-.19-2.98.78.8-2.9-.2-.3A7.94 7.94 0 014 12c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8zm4.4-5.6c-.24-.12-1.44-.71-1.66-.8-.22-.08-.38-.12-.55.12-.16.24-.62.8-.76.96-.14.16-.28.18-.52.06-.24-.12-1-.37-1.9-1.17-.7-.62-1.18-1.4-1.31-1.64-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.8-.2-.48-.4-.42-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.13 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>
        Hubungi Wali Kelas
      </a>
    `;
    resultsEl.appendChild(card);
  });
}

input.addEventListener('input', (e) => {
  clearBtn.classList.toggle('show', e.target.value.length > 0);
  renderResults(e.target.value);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('show');
  input.focus();
  renderResults('');
});

renderResults('');
</script>
